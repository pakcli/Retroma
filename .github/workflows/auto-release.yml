name: Auto release on push (1.0.X patch)

on:
  push:
    branches:
      - main-pakcli
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next 1.0.X tag
        id: vars
        env:
          BASE_MAJOR: 1
          BASE_MINOR: 0
        run: |
          set -eo pipefail
          git fetch --tags --quiet

          # list tags matching vMAJOR.MINOR.* or MAJOR.MINOR.*, strip leading 'v'
          tags=$(git tag --list "v${BASE_MAJOR}.${BASE_MINOR}.*" "${BASE_MAJOR}.${BASE_MINOR}.*" || true)
          tags=$(echo "$tags" | sed 's/^v//' | tr -d '\r')

          # extract patch numbers for matching MAJOR.MINOR and pick the max
          latest=$(printf "%s\n" "$tags" \
            | awk -F. -v maj="$BASE_MAJOR" -v min="$BASE_MINOR" '$1==maj && $2==min {print $3}' \
            | sort -n | tail -n1 || true)

          if [ -z "$latest" ]; then
            next=0
          else
            next=$((latest + 1))
          fi

          TAG="${BASE_MAJOR}.${BASE_MINOR}.${next}"
          echo "Computed tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create release and upload assets
        env:
          ASSET1: manifest.json
          ASSET2: theme.css
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          echo "Creating release $TAG"
          gh release create "$TAG" "$ASSET1" "$ASSET2" \
            --title "Release $TAG" \
            --notes "Automated release: $TAG" \
            --target "${{ github.sha }}" \
            --repo "${{ github.repository }}"

      - name: Show created release
        run: gh release view "${{ steps.vars.outputs.tag }}" --repo "${{ github.repository }}" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
