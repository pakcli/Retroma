name: Auto release on push (1.0.X patch)

on:
  push:
    branches:
      - main-pakcli
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next 1.0.X tag
        id: vars
        env:
          BASE_MAJOR: 1
          BASE_MINOR: 0
        run: |
          set -eo pipefail
          git fetch --tags --quiet

          # list tags matching vMAJOR.MINOR.* or MAJOR.MINOR.*, strip leading 'v'
          tags=$(git tag --list "v${BASE_MAJOR}.${BASE_MINOR}.*" "${BASE_MAJOR}.${BASE_MINOR}.*" || true)
          tags=$(echo "$tags" | sed 's/^v//' | tr -d '\r')

          # extract patch numbers for matching MAJOR.MINOR and pick the max
          latest=$(printf "%s\n" "$tags" \
            | awk -F. -v maj="$BASE_MAJOR" -v min="$BASE_MINOR" '$1==maj && $2==min {print $3}' \
            | sort -n | tail -n1 || true)

          if [ -z "$latest" ]; then
            next=0
          else
            next=$((latest + 1))
          fi

          TAG="${BASE_MAJOR}.${BASE_MINOR}.${next}"
          echo "Computed tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          release_name: Release ${{ steps.vars.outputs.tag }}
          body: Automated release: ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          target_commitish: ${{ github.sha }}

      - name: Upload manifest.json
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: manifest.json
          asset_name: manifest.json
          asset_content_type: application/json

      - name: Upload theme.css
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: theme.css
          asset_name: theme.css
          asset_content_type: text/css
