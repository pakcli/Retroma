name: Auto release + bump manifest (1.0.X)

on:
  push:
    branches:
      - main-pakcli
  workflow_dispatch: {}

permissions:
  contents: write

env:
  BASE_MAJOR: "1"
  BASE_MINOR: "0"
  MANIFEST_PATH: "manifest.json"
  ASSET1_PATH: "manifest.json"
  ASSET2_PATH: "theme.css"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exit when run by actions bot (avoid loop)
        run: |
          if [ "${GITHUB_ACTOR}" = "github-actions[bot]" ] || [ "${GITHUB_ACTOR}" = "github-actions" ]; then
            echo "Run triggered by GitHub Actions bot; exiting to avoid loop."
            exit 0
          fi

      - name: Determine next 1.0.X tag
        id: vars
        shell: bash
        env:
          BASE_MAJOR: "1"
          BASE_MINOR: "0"
        run: |
          set -eo pipefail
          git fetch --tags --quiet

          tags=$(git tag --list "v${BASE_MAJOR}.${BASE_MINOR}.*" "${BASE_MAJOR}.${BASE_MINOR}.*" || true)
          tags=$(printf "%s\n" "$tags" | sed 's/^v//' | tr -d '\r')

          latest=$(printf "%s\n" "$tags" \
            | awk -F. -v maj="$BASE_MAJOR" -v min="$BASE_MINOR" '$1==maj && $2==min {print $3}' \
            | sort -n | tail -n1 || true)

          if [ -z "$latest" ]; then
            next=0
          else
            next=$((latest + 1))
          fi

          TAG="${BASE_MAJOR}.${BASE_MINOR}.${next}"
          echo "Computed tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Bump manifest.json version and push
        id: bump
        shell: bash
        env:
          MANIFEST: ${{ env.MANIFEST_PATH }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -eo pipefail
          MANIFEST="${MANIFEST}"
          TAG="${TAG}"

          if [ ! -f "$MANIFEST" ]; then
            echo "Manifest not found at $MANIFEST"
            exit 1
          fi

          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

          OLD_VERSION=$(jq -r '.version // empty' "$MANIFEST" || true)
          echo "Old manifest version: ${OLD_VERSION:-<none>}"

          tmp="$(mktemp)"
          jq --arg v "$TAG" '.version = $v' "$MANIFEST" > "$tmp"
          mv "$tmp" "$MANIFEST"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST"

          if git diff --staged --quiet; then
            echo "No changes to commit for $MANIFEST"
          else
            COMMIT_MSG="chore(release): bump manifest to $TAG [skip ci]"
            git commit -m "$COMMIT_MSG"
            BRANCH="${GITHUB_REF#refs/heads/}"
            echo "Pushing updated manifest to ${BRANCH}"
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:${BRANCH}"
          fi

          COMMIT_SHA=$(git rev-parse HEAD)
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          release_name: "Release ${{ steps.vars.outputs.tag }}"
          body: |
            Automated release: ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          target_commitish: ${{ steps.bump.outputs.commit_sha }}

      - name: Upload manifest.json asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.ASSET1_PATH }}
          asset_name: ${{ env.ASSET1_PATH }}
          asset_content_type: application/json

      - name: Upload theme.css asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.ASSET2_PATH }}
          asset_name: ${{ env.ASSET2_PATH }}
          asset_content_type: text/css
